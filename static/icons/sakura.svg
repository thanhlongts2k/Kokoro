<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="60%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </radialGradient>
  </defs>
  <!-- Background Soft Aura -->
  <rect width="512" height="512" rx="128" fill="#fff5f7" />
  <circle cx="256" cy="256" r="210" fill="#fdf2f4" />
  
  <!-- 5 Sakura Petals -->
  <g transform="translate(256, 256)">
    <!-- Petal 1 (Top) -->
    <path d="M 0,-15 C -30,-50 -70,-110 -40,-170 C -15,-200 0,-190 0,-180 C 0,-190 15,-200 40,-170 C 70,-110 30,-50 0,-15 Z" fill="url(#sakuraGrad)" opacity="0.95" />
    <!-- Petal 2 (Top Right) -->
    <path d="M 0,-15 C -30,-50 -70,-110 -40,-170 C -15,-200 0,-190 0,-180 C 0,-190 15,-200 40,-170 C 70,-110 30,-50 0,-15 Z" transform="rotate(72)" fill="url(#sakuraGrad)" opacity="0.95" />
    <!-- Petal 3 (Bottom Right) -->
    <path d="M 0,-15 C -30,-50 -70,-110 -40,-170 C -15,-200 0,-190 0,-180 C 0,-190 15,-200 40,-170 C 70,-110 30,-50 0,-15 Z" transform="rotate(144)" fill="url(#sakuraGrad)" opacity="0.95" />
    <!-- Petal 4 (Bottom Left) -->
    <path d="M 0,-15 C -30,-50 -70,-110 -40,-170 C -15,-200 0,-190 0,-180 C 0,-190 15,-200 40,-170 C 70,-110 30,-50 0,-15 Z" transform="rotate(216)" fill="url(#sakuraGrad)" opacity="0.95" />
    <!-- Petal 5 (Top Left) -->
    <path d="M 0,-15 C -30,-50 -70,-110 -40,-170 C -15,-200 0,-190 0,-180 C 0,-190 15,-200 40,-170 C 70,-110 30,-50 0,-15 Z" transform="rotate(288)" fill="url(#sakuraGrad)" opacity="0.95" />

    <!-- Center Pistils & Pollen -->
    <circle cx="0" cy="0" r="32" fill="#fef08a" opacity="0.9" />
    <circle cx="0" cy="0" r="20" fill="#f59e0b" />
    <circle cx="-12" cy="-10" r="4" fill="#fb7185" />
    <circle cx="12" cy="-10" r="4" fill="#fb7185" />
    <circle cx="0" cy="14" r="4" fill="#fb7185" />
    <circle cx="-10" cy="8" r="3" fill="#fb7185" />
    <circle cx="10" cy="8" r="3" fill="#fb7185" />
  </g>
</svg>
